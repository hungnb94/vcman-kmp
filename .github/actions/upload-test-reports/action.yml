name: upload-test-reports
description: >
  Upload the Gradle JUnit XML + HTML test reports produced by the calling job
  as a downloadable artifact, even when the job failed. The artifact name is
  derived from github.job so adding a new job never requires touching this
  action.

runs:
  using: composite
  steps:
    - name: Upload test reports
      # Also required on the step that calls this action (a step after a
      # failed step is skipped by default; `if: always()` here alone can't
      # rescue a step that never ran).
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-reports-${{ github.job }}
        path: |
          **/build/test-results/**
          **/build/reports/tests/**
        if-no-files-found: warn
        retention-days: 14
