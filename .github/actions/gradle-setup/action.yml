name: gradle-setup
description: >
  Set up JDK 17 (Temurin) to run the Gradle 9 daemon, and Gradle itself via the
  official gradle/actions/setup-gradle cache (Gradle User Home: dependencies,
  wrapper, build cache). JDK 17 here is the daemon runtime only and is
  unrelated to jvmTarget = 11 used to compile Kotlin bytecode in this repo.

runs:
  using: composite
  steps:
    - name: Set up JDK 17 (Temurin) for the Gradle daemon
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: "17"
        # No `cache: gradle` here: gradle/actions/setup-gradle below already
        # caches the Gradle User Home, and Gradle's own docs warn that running
        # both at once "may interfere" with each other.

    - name: Set up Gradle (official cache for ~/.gradle)
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # Cache writes are scoped to the default branch by default; pull requests
      # only read from it, so PRs can't pollute each other's cache.
