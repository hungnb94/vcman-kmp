name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-jvm:
    name: Android/JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/gradle-setup

      - name: Install Android SDK platform (compileSdk 37)
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      - name: Run Android/JVM host tests
        run: ./gradlew :sharedUI:testAndroidHostTest :sharedLogic:testAndroidHostTest --continue

      - if: always()
        uses: ./.github/actions/upload-test-reports

  js:
    name: JS tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/gradle-setup

      - name: Run JS/Web tests
        run: ./gradlew :sharedLogic:jsTest

      - if: always()
        uses: ./.github/actions/upload-test-reports

  ios:
    name: iOS tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}

      - uses: ./.github/actions/gradle-setup

      - name: Run iOS simulator tests
        run: ./gradlew :sharedUI:iosSimulatorArm64Test :sharedLogic:iosSimulatorArm64Test --continue

      - if: always()
        uses: ./.github/actions/upload-test-reports
